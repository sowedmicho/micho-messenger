<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - MICHO MESSENGER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #075e54, #128c7e);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .error-container { padding: 40px; }
        .error-icon { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 72px; margin-bottom: 10px; }
        p { font-size: 18px; margin-bottom: 30px; opacity: 0.8; }
        .btn-home {
            display: inline-block;
            padding: 14px 30px;
            background: #25d366;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-home:hover { background: #20bd5a; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">🔍</div>
        <h1>404</h1>
        <p>Oops! Page not found</p>
        <a href="/" class="btn-home">🏠 Go to MICHO MESSENGER</a>
    </div>
    <script>
        // Redirect SPA routes
        if (window.location.pathname !== '/404.html') {
            sessionStorage.setItem('redirect', window.location.href);
        }
        setTimeout(() => {
            window.location.href = '/';
        }, 3000);
    </script>
</body>
</html>
