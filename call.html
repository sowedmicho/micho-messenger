<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Call - MICHO MESSENGER</title>
    <link rel="stylesheet" href="css/call.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: white;
            height: 100vh;
            overflow: hidden;
        }
        .call-container {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }
        .call-header { text-align: center; padding-top: 40px; }
        .call-status { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
        .call-name { font-size: 24px; font-weight: 600; margin-bottom: 4px; }
        .call-duration { font-size: 16px; color: rgba(255,255,255,0.6); }
        .call-avatar {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            border: 3px solid rgba(255,255,255,0.2);
        }
        .call-controls {
            display: flex;
            gap: 20px;
            padding-bottom: 40px;
            align-items: center;
        }
        .call-btn {
            width: 56px; height: 56px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            cursor: pointer;
            color: white;
            transition: all 0.3s;
        }
        .call-btn-mute { background: rgba(255,255,255,0.2); }
        .call-btn-speaker { background: rgba(255,255,255,0.2); }
        .call-btn-end {
            background: #ea0038;
            width: 64px; height: 64px;
            transform: rotate(135deg);
        }
        .call-btn-end i { transform: rotate(-135deg); }
        .call-btn:hover { transform: scale(1.1); }
        .call-btn-end:hover { transform: rotate(135deg) scale(1.1); }
        .video-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: none;
        }
        .video-container.active { display: block; }
        .local-video {
            position: absolute;
            top: 20px; right: 20px;
            width: 120px; height: 160px;
            border-radius: 8px;
            border: 2px solid rgba(255,255,255,0.3);
            object-fit: cover;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="call-container" id="call-container">
        <div class="call-header">
            <p class="call-status" id="call-status">Calling...</p>
            <h2 class="call-name" id="call-contact-name">Contact</h2>
            <p class="call-duration" id="call-duration">00:00</p>
        </div>
        
        <div class="call-avatar" id="call-avatar">
            <i class="fas fa-user"></i>
        </div>
        
        <div class="video-container" id="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" class="local-video" autoplay playsinline muted></video>
        </div>
        
        <div class="call-controls">
            <button class="call-btn call-btn-mute" id="btn-mute" title="Mute">
                <i class="fas fa-microphone"></i>
            </button>
            <button class="call-btn call-btn-speaker" id="btn-speaker" title="Speaker">
                <i class="fas fa-volume-up"></i>
            </button>
            <button class="call-btn call-btn-end" id="btn-end" title="End Call">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/call.js"></script>
</body>
</html>
